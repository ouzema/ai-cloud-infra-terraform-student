name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # jeton OIDC échangé contre le compte team-really-cool-cd, sans fichier de clé

env:
  PROJECT_ID: advanced-cloud-ai
  REGION: europe-west1
  SERVICE: team-really-cool-fraud-api
  IMAGE: europe-west1-docker.pkg.dev/advanced-cloud-ai/cloud-ai/team-really-cool-fraud-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          # pool "github" lu sur le compte -cd ; l'identifiant du provider ("github") est supposé, à confirmer
          workload_identity_provider: projects/191726065850/locations/global/workloadIdentityPools/github/providers/github
          service_account: team-really-cool-cd@advanced-cloud-ai.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construire et pousser l'image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Déployer une nouvelle révision
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID"
