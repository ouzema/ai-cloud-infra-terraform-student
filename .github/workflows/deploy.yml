name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # jeton OIDC échangé contre le compte team-really-cool-cd, sans fichier de clé

env:
  PROJECT_ID: advanced-cloud-ai
  REGION: europe-west1
  SERVICE: team-really-cool-fraud-api
  IMAGE: europe-west1-docker.pkg.dev/advanced-cloud-ai/cloud-ai/team-really-cool-fraud-api:${{ github.sha }} # hash d'un commit de ce dépôt, pas du code applicatif

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # le Dockerfile est dans le dépôt applicatif, pas dans celui-ci
      - uses: actions/checkout@v4
        with:
          repository: ouzema/td2-fraud-api-albertschool

      - uses: google-github-actions/auth@v2
        with:
          # variable du dépôt : projects/191726065850/locations/global/workloadIdentityPools/github/providers/<id donné par l'enseignant>
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: team-really-cool-cd@advanced-cloud-ai.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construire et pousser l'image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Déployer une nouvelle révision
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID"
